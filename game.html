<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
	/* shrink the board to fit narrow windows so the right paddle is never cut off */
	#gameCanvas { max-width: 100%; height: auto; display: block; }
</style>
</head>

<canvas id = "gameCanvas" width="800" height="600">
</canvas>
<p>Move the mouse to control the left paddle. Press <b>1</b>, <b>2</b> or <b>3</b> to play the trained AI on easy, medium or hard (hard also speeds up the ball). Press <b>A</b> to switch between the AI and the classic CPU. Press <b>P</b> or <b>Space</b> to pause.</p>

<!-- Trained PPO agent weights for each level, generated by ai/export_policy.py.
     Bump ?v= when retraining so browsers don't keep an old copy cached. -->
<script src="ai/models/ppo_pong_easy.js?v=3"></script>
<script src="ai/models/ppo_pong_medium.js?v=3"></script>
<script src="ai/models/ppo_pong_hard.js?v=3"></script>
<script>
var canvas;
var canvasContent;
var ballX = 50;
var ballSpeedX = 10;
var ballY = 50;
var ballSpeedY = 4;
var player1Score = 0;
var player2Score = 0;
var paddle1Y = 250;
var paddle2Y = 250;
const PADDLE_HEIGHT = 100;
const PADDLE_THICKNESS = 10;
const BALL_SPEED_X = 10;
const BALL_SPEED_Y = 4;
const SPIN_FACTOR = 0.35;
const MAX_BALL_SPEED_Y = PADDLE_HEIGHT/2 * SPIN_FACTOR;
const AI_PADDLE_SPEED = 12;
var useNeuralAI = false;
var aiLevel = 'easy';
const LEVEL_KEYS = {'1': 'easy', '2': 'medium', '3': 'hard'};
var paused = false;

var myMusic;

function calculateMousePos(evt){
	var rect = canvas.getBoundingClientRect();
	//the canvas can be drawn smaller than 800x600, so convert screen pixels to game pixels
	var mouseX = (evt.clientX - rect.left) * canvas.width / rect.width;
	var mouseY = (evt.clientY - rect.top) * canvas.height / rect.height;
	return{
		x:mouseX,
		y:mouseY
	};
	
}

window.onload=function(){
	console.log("Hello World!");
	canvas = document.getElementById('gameCanvas');
	canvasContent = canvas.getContext('2d');
	//myMusic= new sound("");
	var framesPerSecond = 30;
	setInterval(function(){
	if(!paused){
		moveEverything();
	}
	drawEverything();
	}, 1000/framesPerSecond); //1000 milliseconds
	
	canvas.addEventListener('mousemove', function(evt){
		if(paused){
			return; //the paddle stays put while paused
		}
		var mousePos= calculateMousePos(evt);
		paddle1Y = mousePos.y- (PADDLE_HEIGHT/2);
	});

	document.addEventListener('keydown', function(evt){
		if((evt.key == 'a' || evt.key == 'A') && levelLoaded(aiLevel)){
			setOpponent(!useNeuralAI, aiLevel);
		}
		if(LEVEL_KEYS[evt.key] && levelLoaded(LEVEL_KEYS[evt.key])){
			setOpponent(true, LEVEL_KEYS[evt.key]);
		}
		if(evt.key == 'p' || evt.key == 'P' || evt.key == ' '){
			evt.preventDefault(); //stops space from scrolling the page
			paused = !paused;
		}
	});
}
function levelLoaded(level){
	return window.PONG_AI_LEVELS && window.PONG_AI_LEVELS[level];
}

//1.0 = normal speed; the hard AI was trained with a faster ball, so it plays with one
function ballSpeedScale(){
	return useNeuralAI ? window.PONG_AI_LEVELS[aiLevel].ballSpeed : 1;
}

//switches the right paddle's controller and rescales the ball if the speed changes
function setOpponent(neural, level){
	var oldScale = ballSpeedScale();
	useNeuralAI = neural;
	aiLevel = level;
	var newScale = ballSpeedScale();
	ballSpeedX *= newScale/oldScale;
	ballSpeedY *= newScale/oldScale;
}

function ballReset(){
	ballSpeedX = (ballSpeedX > 0 ? -BALL_SPEED_X : BALL_SPEED_X) * ballSpeedScale();
	ballX = canvas.width/2;
	ballY = canvas.height/2;
	ballSpeedY = (Math.random() < 0.5 ? BALL_SPEED_Y : -BALL_SPEED_Y) * ballSpeedScale();
}

//runs the trained network (tanh MLP) and returns the index of the highest scoring action
function neuralNetAction(observation){
	var layers = window.PONG_AI_LEVELS[aiLevel].layers;
	var values = observation;
	for(var l = 0; l < layers.length; l++){
		var next = [];
		for(var i = 0; i < layers[l].weights.length; i++){
			var sum = layers[l].bias[i];
			for(var j = 0; j < layers[l].weights[i].length; j++){ //older agents take fewer inputs
				sum += layers[l].weights[i][j] * values[j];
			}
			next.push(l < layers.length-1 ? Math.tanh(sum) : sum);
		}
		values = next;
	}
	return values.indexOf(Math.max.apply(null, values));
}

//the agent was trained as the left paddle, so mirror the x axis for the right paddle
function neuralAIMovement(){
	var observation = [
		(canvas.width-ballX)/canvas.width,
		ballY/canvas.height,
		-ballSpeedX/(BALL_SPEED_X*ballSpeedScale()),
		ballSpeedY/(MAX_BALL_SPEED_Y*ballSpeedScale()),
		paddle2Y/(canvas.height-PADDLE_HEIGHT),
		Math.min(Math.max(paddle1Y, 0), canvas.height-PADDLE_HEIGHT)/(canvas.height-PADDLE_HEIGHT) //your paddle
	];
	var action = neuralNetAction(observation); //0 = up, 1 = down, 2 = stay
	if(action == 0){
		paddle2Y -= AI_PADDLE_SPEED;
	}else if(action == 1){
		paddle2Y += AI_PADDLE_SPEED;
	}
	paddle2Y = Math.min(Math.max(paddle2Y, 0), canvas.height-PADDLE_HEIGHT);
}

//the ball leaves at an angle based on where it hit the paddle
function bounceOffPaddle(paddleY){
	ballSpeedX = -ballSpeedX;
	var deltaY = ballY - (paddleY+PADDLE_HEIGHT/2);
	ballSpeedY = deltaY * SPIN_FACTOR * ballSpeedScale();
}

function computerMovement(){
	var paddle2YCenter = paddle2Y+ (PADDLE_HEIGHT/2);
	if(paddle2YCenter < ballY-35){
		paddle2Y += 6;
	}else if (paddle2YCenter>ballY+35){
		paddle2Y -= 6;
	}
}

function moveEverything(){
	if(useNeuralAI){
		neuralAIMovement();
	}else{
		computerMovement();
	}
	ballX += ballSpeedX;
	ballY += ballSpeedY;

	//bounce off the top and bottom walls first, so a ball in a corner can't slip past a paddle
	if (ballY < 0){
		ballY = -ballY;
		ballSpeedY=-ballSpeedY;
	}
	if (ballY > canvas.height){
		ballY = 2*canvas.height - ballY;
		ballSpeedY = -ballSpeedY;
	}

	if (ballX < 0){
		if (ballY>paddle1Y &&
		 ballY < paddle1Y+PADDLE_HEIGHT){
		 bounceOffPaddle(paddle1Y);
		 ballX = 0;
		 }
		 else{
			ballReset(); 
			player2Score++;
		 }
	}
	if (ballX > canvas.width){
		if (ballY>paddle2Y &&
		 ballY < paddle2Y+PADDLE_HEIGHT){
		 bounceOffPaddle(paddle2Y);
		 ballX = canvas.width;
		 }
		 else{
			ballReset();
			player1Score++;			
		 }
	}
	
	
}

function drawEverything(){
	//draws the enviornment
	colorRect(0,0,canvas.width,canvas.height, 'black');
	//draws the paddle1Y
	colorRect(0,paddle1Y,PADDLE_THICKNESS ,PADDLE_HEIGHT,'white');
	
	//draws the paddle2Y
	colorRect(canvas.width-PADDLE_THICKNESS,paddle2Y,PADDLE_THICKNESS,PADDLE_HEIGHT,'white');
	
	//draws the ball
	colorCircle(ballX, ballY, 10, 'white');
	
	//displays score
	//canvasContent.fillText('HELLO', 100, 100);
	canvasContent.fillText(player1Score, 100, 100);
	canvasContent.fillText(player2Score, canvas.width-100, 100);

	//shows who controls the right paddle
	var opponent = useNeuralAI ? 'Neural AI - ' + aiLevel.charAt(0).toUpperCase() + aiLevel.slice(1) : 'Classic CPU';
	if(!window.PONG_AI_LEVELS){
		opponent += ' - train the AI to unlock Neural AI';
	}
	canvasContent.fillText('Opponent: ' + opponent + '  [1-3: AI level, A: AI/CPU]', canvas.width-330, canvas.height-20);

	if(paused){
		canvasContent.fillStyle = 'white';
		canvasContent.font = '40px sans-serif';
		canvasContent.textAlign = 'center';
		canvasContent.fillText('PAUSED', canvas.width/2, canvas.height/2);
		canvasContent.font = '16px sans-serif';
		canvasContent.fillText('Press P or Space to resume', canvas.width/2, canvas.height/2 + 30);
		canvasContent.font = '10px sans-serif';
		canvasContent.textAlign = 'start';
	}
}

function colorCircle(centerX, centerY, radius, drawColor){
	canvasContent.fillStyle= drawColor;
	canvasContent.beginPath();
	//second one is y postion, thrird is width, and fourth is where is starts.
	canvasContent.arc(centerX, centerY, radius, 0, Math.PI*2, true);
	canvasContent.fill();

}

function colorRect(leftx, topy, width, height, drawColor){
		canvasContent.fillStyle = drawColor;
	canvasContent.fillRect(leftx, topy, width, height);

}

</script>

</html>
